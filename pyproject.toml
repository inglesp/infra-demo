[project]
name = "infra-demo"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "django>=6.1.2",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.per-file-ignores]
# Django generates migrations with mutable class attributes
"*/migrations/*" = ["RUF012"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.17.2",
]
