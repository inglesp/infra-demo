# jq is for the deploy script
- name: Install Docker and jq
  ansible.builtin.apt:
    name: [docker.io, jq]
    update_cache: true
    # Don't refresh a cache that's under an hour old, so reruns change nothing
    cache_valid_time: 3600

- name: Install the service that blocks containers from the metadata service
  ansible.builtin.copy:
    src: block-metadata.service
    dest: /etc/systemd/system/block-metadata.service
    mode: "0644"
  notify: Reload systemd

# So that systemd has loaded the service before it's started
- name: Run handlers
  ansible.builtin.meta: flush_handlers

- name: Block containers from the metadata service
  ansible.builtin.systemd_service:
    name: block-metadata.service
    enabled: true
    state: started

- name: Add the key that signs Dokku's apt repository
  ansible.builtin.get_url:
    url: https://packagecloud.io/dokku/dokku/gpgkey
    dest: /etc/apt/keyrings/dokku.asc
    mode: "0644"
  register: dokku_repo_key

# Written as a file, rather than with deb822_repository, because different
# versions of that module order the fields differently, so the file would
# change whenever Ubuntu's ansible package did.
- name: Add Dokku's apt repository
  ansible.builtin.copy:
    content: |
      Types: deb
      URIs: https://packagecloud.io/dokku/dokku/ubuntu/
      Suites: {{ ansible_facts['distribution_release'] }}
      Components: main
      Signed-By: /etc/apt/keyrings/dokku.asc
    dest: /etc/apt/sources.list.d/dokku.sources
    mode: "0644"
  register: dokku_repo

# The cache was probably refreshed above, so cache_valid_time wouldn't refresh
# it again to pick up the new repository
- name: Update the apt cache for Dokku's repository
  ansible.builtin.apt:
    update_cache: true
  when: dokku_repo_key.changed or dokku_repo.changed

# skip_key_file: we don't deploy with `git push`, so Dokku needs no SSH key
# web_config: don't serve Dokku's old web-based setup page
- name: Answer Dokku's install questions
  ansible.builtin.debconf:
    name: dokku
    question: dokku/{{ item.question }}
    vtype: "{{ item.vtype }}"
    value: "{{ item.value }}"
  loop:
    - { question: vhost_enable, vtype: boolean, value: "true" }
    - { question: hostname, vtype: string, value: "{{ domain }}" }
    - { question: skip_key_file, vtype: boolean, value: "true" }
    - { question: web_config, vtype: boolean, value: "false" }
    - { question: nginx_enable, vtype: boolean, value: "true" }

- name: Install Dokku
  ansible.builtin.apt:
    name: dokku
  notify: Install Dokku's plugin dependencies

- name: List Dokku's plugins
  ansible.builtin.command: dokku --quiet plugin:list
  register: dokku_plugins
  changed_when: false
  check_mode: false

# Each line of plugin:list starts with the plugin's name
- name: Install Dokku's letsencrypt plugin
  ansible.builtin.command: >-
    dokku plugin:install https://github.com/dokku/dokku-letsencrypt.git
    --committish {{ letsencrypt_plugin_version }} --name letsencrypt
  when: "'letsencrypt' not in dokku_plugins.stdout_lines | map('split') | map('first') | list"

- name: Read letsencrypt's global settings
  ansible.builtin.command: dokku letsencrypt:report --global --format json
  register: letsencrypt_global
  changed_when: false
  check_mode: false

- name: Set letsencrypt's email
  ansible.builtin.command: dokku letsencrypt:set --global email {{ letsencrypt_email }}
  when: (letsencrypt_global.stdout | from_json)["global-email"] != letsencrypt_email

- name: Read the status of letsencrypt's renewal cron job
  ansible.builtin.command: dokku letsencrypt:cron-job
  register: letsencrypt_cron_job
  changed_when: false
  check_mode: false

- name: Add letsencrypt's renewal cron job
  ansible.builtin.command: dokku letsencrypt:cron-job --add
  when: "'cron job is not enabled' in letsencrypt_cron_job.stdout"

# Dokku has no declarative config, so each setting is read first, and only
# changed when it differs. The reads run in check mode too, since they change
# nothing.
- name: List Dokku's apps
  ansible.builtin.command: dokku --quiet apps:list
  register: dokku_apps
  changed_when: false
  check_mode: false

- name: Create the Dokku app
  ansible.builtin.command: dokku apps:create {{ app_name }}
  when: app_name not in dokku_apps.stdout_lines

# If the app has only just been created (or would be, in check mode), there's
# nothing to read, so the domain is set regardless
- name: Read the app's domains
  ansible.builtin.command: dokku domains:report {{ app_name }} --domains-app-vhosts
  register: dokku_app_domains
  changed_when: false
  check_mode: false
  when: app_name in dokku_apps.stdout_lines

- name: Set the app's domain
  ansible.builtin.command: dokku domains:set {{ app_name }} {{ domain }}
  when: dokku_app_domains is skipped or dokku_app_domains.stdout.split() != [domain]

- name: Read whether letsencrypt is active for the app
  ansible.builtin.command: dokku letsencrypt:report {{ app_name }} --letsencrypt-active
  register: letsencrypt_active
  changed_when: false
  check_mode: false
  when: app_name in dokku_apps.stdout_lines

# Otherwise Dokku publishes the port the image exposes, rather than 80
- name: Read the app's port mappings
  ansible.builtin.command: dokku ports:report {{ app_name }} --ports-map
  register: dokku_app_ports
  changed_when: false
  check_mode: false
  when: app_name in dokku_apps.stdout_lines

# Enabling letsencrypt adds a mapping for 443, and disabling it removes it
- name: Route ports 80 and 443 to the app
  vars:
    app_ports: >-
      {{ ["http:80:" ~ app_port]
         + (["https:443:" ~ app_port] if letsencrypt_active is not skipped and letsencrypt_active.stdout == "true" else []) }}
  ansible.builtin.command: dokku ports:set {{ app_name }} {{ app_ports | join(" ") }}
  when: dokku_app_ports is skipped or dokku_app_ports.stdout.split() != app_ports

- name: Read the app's storage mounts
  ansible.builtin.command: dokku --quiet storage:list {{ app_name }}
  register: dokku_app_storage
  changed_when: false
  check_mode: false
  when: app_name in dokku_apps.stdout_lines

- name: Mount the volume into the app's container
  ansible.builtin.command: dokku storage:mount {{ app_name }} {{ app_storage_mount }}
  when: dokku_app_storage is skipped or app_storage_mount not in dokku_app_storage.stdout_lines
  notify: Restart the app

# The environment holds secrets, so these tasks don't log their output
- name: Read the app's environment
  ansible.builtin.command: dokku config:export --format json {{ app_name }}
  register: dokku_config
  changed_when: false
  check_mode: false
  when: app_name in dokku_apps.stdout_lines
  no_log: true

# Each key is set on its own, and only if it differs, since config:set
# restarts the app. argv passes the value as it is, without splitting it.
- name: Set the app's environment
  ansible.builtin.command:
    argv: [dokku, config:set, "{{ app_name }}", "{{ item.key }}={{ item.value }}"]
  loop: "{{ app_env | combine(app_secret_env) | dict2items }}"
  when: dokku_config is skipped or (dokku_config.stdout | from_json).get(item.key) != item.value
  no_log: true

# DigitalOcean mounts a newly attached volume under /mnt with its own systemd
# unit. We mount it ourselves, so remove that.
- name: Remove DigitalOcean's mount of the volume
  vars:
    do_mount_unit: mnt-{{ volume_name | replace('-', '_') }}.mount
  block:
    - name: Find DigitalOcean's mount unit
      ansible.builtin.stat:
        path: /etc/systemd/system/{{ do_mount_unit }}
      register: do_mount_unit_file

    - name: Stop DigitalOcean's mount unit
      ansible.builtin.systemd_service:
        name: "{{ do_mount_unit }}"
        state: stopped
        enabled: false
      when: do_mount_unit_file.stat.exists

    - name: Remove DigitalOcean's mount unit
      ansible.builtin.file:
        path: /etc/systemd/system/{{ do_mount_unit }}
        state: absent
      notify: Reload systemd

# On a new droplet, the volume can be attached after Ansible has started
- name: Wait for the volume's device
  ansible.builtin.wait_for:
    path: "{{ volume_device }}"
    timeout: 120

- name: Mount the volume
  ansible.posix.mount:
    path: "{{ data_dir }}"
    src: "{{ volume_device }}"
    fstype: ext4
    # nofail, so that the droplet still boots if the volume is missing
    opts: defaults,nofail,discard,noatime
    state: mounted

- name: Give the data directory to the app's user
  ansible.builtin.file:
    path: "{{ data_dir }}"
    state: directory
    owner: "{{ app_uid }}"
    group: "{{ app_uid }}"
    mode: "0755"

- name: Set the alert webhook
  ansible.builtin.copy:
    content: "{{ alert_webhook_url }}"
    dest: /etc/web-app/alert-webhook
    mode: "0600"
  no_log: true

- name: Install the alert scripts
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: /usr/local/bin/{{ item }}
    mode: "0755"
  loop: [notify-failure, notify-recovery]

- name: Install the alert services
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: /etc/systemd/system/{{ item }}
    mode: "0644"
  loop: [notify-failure@.service, notify-recovery@.service]
  notify: Reload systemd

# The deploy script reads this when it runs, so a change takes effect on its
# next run
- name: Set the image to deploy
  ansible.builtin.copy:
    content: "{{ image }}:{{ image_tag }}\n"
    dest: /etc/web-app/image
    mode: "0644"

- name: Install the deploy script
  ansible.builtin.copy:
    src: deploy
    dest: /usr/local/bin/deploy
    mode: "0755"

- name: Install the deploy service
  ansible.builtin.copy:
    src: deploy.service
    dest: /etc/systemd/system/deploy.service
    mode: "0644"
  notify: Reload systemd

- name: Install the deploy timer
  ansible.builtin.copy:
    src: deploy.timer
    dest: /etc/systemd/system/deploy.timer
    mode: "0644"
  notify: Reload systemd

# So that systemd has loaded the deploy units before anything starts them
- name: Run handlers
  ansible.builtin.meta: flush_handlers

# A timer doesn't start its service again while it's still running, so slow
# deploys don't pile up
- name: Start the deploy timer
  ansible.builtin.systemd_service:
    name: deploy.timer
    enabled: true
    state: started
