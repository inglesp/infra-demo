- name: Install Docker
  ansible.builtin.apt:
    name: docker.io
    update_cache: true
    # Don't refresh a cache that's under an hour old, so reruns change nothing
    cache_valid_time: 3600

- name: Add Dokku's apt repository
  ansible.builtin.deb822_repository:
    name: dokku
    types: deb
    uris: https://packagecloud.io/dokku/dokku/ubuntu/
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: main
    signed_by: https://packagecloud.io/dokku/dokku/gpgkey
  register: dokku_repo

# The cache was probably refreshed above, so cache_valid_time wouldn't refresh
# it again to pick up the new repository
- name: Update the apt cache for Dokku's repository
  ansible.builtin.apt:
    update_cache: true
  when: dokku_repo.changed

# skip_key_file: we don't deploy with `git push`, so Dokku needs no SSH key
# web_config: don't serve Dokku's old web-based setup page
- name: Answer Dokku's install questions
  ansible.builtin.debconf:
    name: dokku
    question: dokku/{{ item.question }}
    vtype: "{{ item.vtype }}"
    value: "{{ item.value }}"
  loop:
    - { question: vhost_enable, vtype: boolean, value: "true" }
    - { question: hostname, vtype: string, value: "{{ domain }}" }
    - { question: skip_key_file, vtype: boolean, value: "true" }
    - { question: web_config, vtype: boolean, value: "false" }
    - { question: nginx_enable, vtype: boolean, value: "true" }

- name: Install Dokku
  ansible.builtin.apt:
    name: dokku
  notify: Install Dokku's plugin dependencies

# Dokku has no declarative config, so each setting is read first, and only
# changed when it differs. The reads run in check mode too, since they change
# nothing.
- name: List Dokku's apps
  ansible.builtin.command: dokku --quiet apps:list
  register: dokku_apps
  changed_when: false
  check_mode: false

- name: Create the Dokku app
  ansible.builtin.command: dokku apps:create {{ app_name }}
  when: app_name not in dokku_apps.stdout_lines

# If the app has only just been created (or would be, in check mode), there's
# nothing to read, so the domain is set regardless
- name: Read the app's domains
  ansible.builtin.command: dokku domains:report {{ app_name }} --domains-app-vhosts
  register: dokku_app_domains
  changed_when: false
  check_mode: false
  when: app_name in dokku_apps.stdout_lines

- name: Set the app's domain
  ansible.builtin.command: dokku domains:set {{ app_name }} {{ domain }}
  when: dokku_app_domains is skipped or dokku_app_domains.stdout.split() != [domain]

# Otherwise Dokku publishes the port the image exposes, rather than 80
- name: Read the app's port mappings
  ansible.builtin.command: dokku ports:report {{ app_name }} --ports-map
  register: dokku_app_ports
  changed_when: false
  check_mode: false
  when: app_name in dokku_apps.stdout_lines

- name: Route port 80 to the app
  ansible.builtin.command: dokku ports:set {{ app_name }} http:80:{{ app_port }}
  when: dokku_app_ports is skipped or dokku_app_ports.stdout.split() != ["http:80:" ~ app_port]

- name: Read the app's storage mounts
  ansible.builtin.command: dokku --quiet storage:list {{ app_name }}
  register: dokku_app_storage
  changed_when: false
  check_mode: false
  when: app_name in dokku_apps.stdout_lines

- name: Mount the volume into the app's container
  ansible.builtin.command: dokku storage:mount {{ app_name }} {{ app_storage_mount }}
  when: dokku_app_storage is skipped or app_storage_mount not in dokku_app_storage.stdout_lines
  notify: Restart the app

# The environment holds secrets, so these tasks don't log their output
- name: Read the app's environment
  ansible.builtin.command: dokku config:export --format json {{ app_name }}
  register: dokku_config
  changed_when: false
  check_mode: false
  when: app_name in dokku_apps.stdout_lines
  no_log: true

# Each key is set on its own, and only if it differs, since config:set
# restarts the app. argv passes the value as it is, without splitting it.
- name: Set the app's environment
  ansible.builtin.command:
    argv: [dokku, config:set, "{{ app_name }}", "{{ item.key }}={{ item.value }}"]
  loop: "{{ app_env | dict2items }}"
  when: dokku_config is skipped or (dokku_config.stdout | from_json).get(item.key) != item.value
  no_log: true

# DigitalOcean mounts a newly attached volume under /mnt with its own systemd
# unit. We mount it ourselves, so remove that.
- name: Remove DigitalOcean's mount of the volume
  vars:
    do_mount_unit: mnt-{{ volume_name | replace('-', '_') }}.mount
  block:
    - name: Find DigitalOcean's mount unit
      ansible.builtin.stat:
        path: /etc/systemd/system/{{ do_mount_unit }}
      register: do_mount_unit_file

    - name: Stop DigitalOcean's mount unit
      ansible.builtin.systemd_service:
        name: "{{ do_mount_unit }}"
        state: stopped
        enabled: false
      when: do_mount_unit_file.stat.exists

    - name: Remove DigitalOcean's mount unit
      ansible.builtin.file:
        path: /etc/systemd/system/{{ do_mount_unit }}
        state: absent
      notify: Reload systemd

# On a new droplet, the volume can be attached after Ansible has started
- name: Wait for the volume's device
  ansible.builtin.wait_for:
    path: "{{ volume_device }}"
    timeout: 120

- name: Mount the volume
  ansible.posix.mount:
    path: "{{ data_dir }}"
    src: "{{ volume_device }}"
    fstype: ext4
    # nofail, so that the droplet still boots if the volume is missing
    opts: defaults,nofail,discard,noatime
    state: mounted

- name: Give the data directory to the app's user
  ansible.builtin.file:
    path: "{{ data_dir }}"
    state: directory
    owner: "{{ app_uid }}"
    group: "{{ app_uid }}"
    mode: "0755"
